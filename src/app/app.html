<form #userForm="ngForm" (ngSubmit)="onSubmit()">
  <h2>Registration Form</h2>

  <label>First Name:</label><br />
  <input type="text" name="fname" [(ngModel)]="fname" required /><br /><br />

  <label>Last Name:</label><br />
  <input type="text" name="lname" [(ngModel)]="lname" required /><br /><br />

  <label>Email:</label><br />
  <input type="email" name="email" [(ngModel)]="email" required /><br /><br />

  <label>Age:</label><br />
  <input type="number" name="age" [(ngModel)]="age" required min="18" /><br /><br />

  <label>College:</label><br />
  <input type="text" name="clg" [(ngModel)]="clg" required /><br /><br />

  <label>Department:</label><br />
  <input type="text" name="dept" [(ngModel)]="dept" required /><br /><br />

  <button type="submit" [disabled]="userForm.invalid">Submit</button>
</form>
